[project]
name = "rebereal"
version = "0.1.0"
description = "Reconstruct BeReal posts from a BeReal data export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Holik" }]
dependencies = [
    "Pillow>=10",
    "piexif>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.6"]

[project.scripts]
rebereal = "rebereal.cli:main"
rebereal-gui = "rebereal.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rebereal.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
